manifestVersion: 1
id: bch2-apps-forge-solo
name: Forge Solo
tagline: Solo-mine BCH2 at home and merge-mine 1175
icon: https://raw.githubusercontent.com/BitcoincashII/BCH2-Graphics/main/bch2_logo.png
category: bitcoin
version: "1.0.13"
# The dashboard's port. Not 3080, which other apps use: installing would fail with "port is
# already allocated". The miners' ports are 3333 and 3335.
port: 31175
description: >-
  Point your ASIC or Bitaxe at your own Umbrel and mine BCH2 on your own node. Solo:
  a block you find pays you the full reward (no pool fee, no PPLNS), and with a 1175
  address set every share also merge-mines 1175 (ESF) at no extra hashrate cost. Or
  TIDES pool: share blocks with other miners through Forge Pool's TIDES window, paid
  straight from each block's coinbase, still with no fee.


  This is a home miner, not a production pool: one household.


  Includes:
    - A built-in BCH2 full node (auto-syncs and keeps the whole chain)
    - A built-in 1175 (ESF) node for AuxPoW merge-mining
    - A simple dashboard: hashrate, effort, your blocks, payouts, and the TIDES window
    - Block rewards paid straight to your address by the coinbase, with no payout wallet
    - Variable difficulty (works with small ASICs like the Bitaxe)

  Set your BCH2 payout address, and your 1175 payout address, on the app's Settings page:
  every block's reward is paid there, and the miner's worker name is just a label. Then point
  your miner at stratum+tcp://<your-umbrel-ip>:3333 and you're mining. Braiins connects each
  miner individually, so it uses 3333 like your own hardware; NiceHash and MiningRigRentals put
  the whole order behind one connection, so they use 3335.


  Settings asks for Forge Solo's password before it saves a change. umbrelOS shows it when you
  open the app, and any time later when you right-click the Forge Solo icon.


  To accept inbound peers, forward TCP 8339 (BCH2) and 25360 (1175) in your router. To
  accept rented hashpower, forward 3333 (Braiins) or 3335 (NiceHash/MiningRigRentals).


  Forge Solo needs ports 3333 and 3335 for miners, and 8339 and 25360 for the nodes' peers. If
  another app already uses one, installing stops with "exit code 1", and the parts of Forge Solo
  that had started, such as the nodes, keep running in the background: free the port and install
  Forge Solo again. An app installed after Forge Solo whose own port is 3333 or 3335 takes that
  port without an error: Bleskomat Server uses 3333 and Bitmagnet uses 3335, so neither can run
  beside Forge Solo.

developer: BCH2 Team
website: https://bch2.org
repo: https://github.com/BitcoincashII/forge-solo
support: https://github.com/BitcoincashII/forge-solo/issues
# Empty until screenshots are hosted where the store can reach them. Not omitted: umbrelOS 2.0's
# app page reads gallery.length.
gallery: []
releaseNotes: >-
  Forge Solo keeps its data in one file, is much smaller, and records your blocks more reliably.


  Highlights:
    - At the first start your settings, blocks and payouts move into db/forgesolo.db, once.
    - The old database stays in postgres/ for going back to 1.0.12. Once 1.0.13 shows your data, you can delete it. If the move fails, nothing is lost: the dashboard says why and offers to start without the old data.
    - Installing downloads about 240 MB instead of 930 MB; its images take about 0.6 GB of disk instead of 2.3 GB.
    - Settings asks for Forge Solo's password, shown when you open the app or right-click its icon. Other apps reach only the dashboard.
    - A found block is retried for 30 minutes while the node is busy, and recorded once it can be. A new payout address applies at once.
    - The dashboard's totals stay right past 100 blocks, and the pages work on phones.
    - Each miner's difficulty stays near its level, never above the network's.
    - Rentals get a difficulty inside MiningRigRentals' optimal range for most rigs; TIDES no longer under-credits their first jobs.
    - The BCH2 node rebuilds chain data a power cut damaged, once, instead of restarting for ever.
    - The mining ports and TIDES mode hold up against bad shares, idle connections and a slow pool.

  Full release notes: https://github.com/BitcoincashII/forge-solo/blob/main/RELEASE_NOTES.md
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
# umbrelOS shows this app's own password (APP_PASSWORD, which the api gets as SETTINGS_PASSWORD)
# under Default credentials. Forge Solo asks for it before it saves a settings change.
deterministicPassword: true
# Umbrel's hourly backups skip the chains: they are copied live, file by file, so a restored copy
# may need a reindex anyway, and both nodes download them again. They skip the nodes' debug.log
# too: tens of megabytes of what the app's own logs already hold. Settings and the block history
# are kept: db/ (forgesolo.db), and postgres/, the database of 1.0.12 and earlier, kept for going
# back to it.
backupIgnore:
  - node/blocks
  - node/chainstate
  - node/debug.log
  - node1175/blocks
  - node1175/chainstate
  - node1175/debug.log
