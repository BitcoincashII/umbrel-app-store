manifestVersion: 1
id: bch2-apps-forge-solo
name: Forge Solo
tagline: Solo-mine BCH2 at home and merge-mine 1175
icon: https://raw.githubusercontent.com/BitcoincashII/BCH2-Graphics/main/bch2_logo.png
category: bitcoin
version: "1.0.11"
# 31175, not 3080: an Umbrel that already uses 3080 (another app, or a stuck prior
# install attempt) fails to install this one with "Bind for 0.0.0.0:3080 failed: port is
# already allocated". The community store moved to 31175 in v1.0.5; this manifest was
# never updated to match and sat stale through v1.0.8. Dashboard UI port only -- the
# miner ports are 3333 and 3335 and are unaffected.
port: 31175
description: >-
  Point your ASIC or Bitaxe at your own Umbrel and mine BCH2 SOLO — you keep the
  full block reward (no pool fee, no PPLNS). Every share also merge-mines 1175
  (ESF) at no extra hashrate cost, so a lucky block pays you on both chains.

  This is a home miner, not a production pool: one household, solo only.

  Includes:
  - A built-in BCH2 full node (auto-syncs, pruned for home use)
  - A built-in 1175 (ESF) node for AuxPoW merge-mining
  - A simple solo dashboard: hashrate, effort, your blocks, payouts
  - Block rewards paid straight to your address by the coinbase — no payout wallet
  - Variable difficulty (works with small ASICs like the Bitaxe)

  To accept inbound peers, forward TCP 8339 (BCH2) and 25360 (1175) in your router. To
  accept rented hashpower, forward 3333 (Braiins) or 3335 (NiceHash/MiningRigRentals).

  Set your BCH2 payout address on the app's Settings page — every block's reward is
  paid there; the miner's worker name is just a label. Then point your miner at
  stratum+tcp://<your-umbrel-ip>:3333 , set your 1175 payout address, and you're
  mining. Braiins connects each miner individually, so it uses 3333 like your own hardware;
  NiceHash and MiningRigRentals put the whole order behind one connection, so they use 3335.

developer: BCH2 Team
website: https://bch2.org
repo: https://github.com/BitcoincashII/forge-solo
support: https://github.com/BitcoincashII/forge-solo/issues
# gallery: omitted until screenshots are hosted somewhere the store can reach. The
# previous URLs 404'd and rendered as broken images in the listing.
releaseNotes: >-
  Your node can finally be reached from outside. It never announced an address of its own,
  so no peer ever learned how to connect in — inbound connections stayed at zero however
  your router was forwarded, and the notice asking you to open ports could not clear no
  matter what you did about it. The node now learns the address your peers see you on and
  announces it from the next start, so a correct port forward attracts the peers it should.

  The dashboard knows your public address again. It was reading a field that is always
  empty inside a container, so the Connect & Network card said "Public address not known
  yet" and had no endpoint to give a rental marketplace. It now takes the address your
  peers report back, accepting it only when several of them independently agree.

  The reachability notice covers BCH2 only. 1175 is merge-mined, and whether its peer port
  is open has no bearing on your mining, so it no longer raises a warning asking you to
  forward a second port.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
