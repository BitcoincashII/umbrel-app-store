# Forge Solo: self-hosted SOLO mining for home miners.
# Mine BCH2 solo to your OWN address and merge-mine 1175 (ESF) at no extra hashrate cost.
# One household, solo only. All secrets are generated per-install by exports.sh; node RPC
# ports are never published to the host, and app_proxy fronts the web dashboard (standard
# Umbrel pattern).

# The app's own containers talk on a network of their own. Every Umbrel app joins the one shared
# umbrel_main_network by default, so both nodes' RPC and the stratum's stats API were reachable
# from every other app's containers. Only web is on both networks: umbrelOS reaches the dashboard
# through it there.
networks:
  forge: {}

services:
  # The services reach each other by container name (bch2-apps-forge-solo_<service>_1, the name
  # umbreld gives every container), never by bare service name. On umbrel_main_network a bare name
  # such as "postgres", "api" or "node" is also the alias of other apps' services (BTCPay Server and
  # Immich have a postgres, mempool and LocalAI an api), so a lookup returns both apps' containers.
  app_proxy:
    environment:
      APP_HOST: bch2-apps-forge-solo_web_1
      APP_PORT: 80

  node:
    image: ghcr.io/bitcoincashii/forge-solo-node:1.0.13@sha256:72c37ed966c8d4f9fc8e0ecd19a47fd6d8c325c0682d748401aeee1cfec765c8
    networks:
      - forge
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # BCH2 peer-to-peer. Published so the node can ACCEPT inbound peers, not just make
      # outbound ones. Forward 8339 in your router to actually receive them. The RPC port
      # is deliberately NOT published -- it stays on the app's private network.
      - "8339:8339"
    volumes:
      - ${APP_DATA_DIR}/node:/data/.bch2
    environment:
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
    command:
      - -datadir=/data/.bch2
      - -disablewallet           # no wallet is used; none can be created over RPC either
      - -printtoconsole
      # Memory: a 100 MB database cache, a 50 MB mempool and a 4 MB signature cache. Core's defaults
      # (450, 300, 32 MB) are sized for a machine of its own; this node shares one, often a small
      # board, with the 1175 node and other apps, and its whole UTXO set is about 15 MB.
      - -dbcache=100
      - -maxmempool=50
      - -maxsigcachesize=4
      - -listen=1                 # accept inbound peers (forward 8339 in your router)
      # Bind explicitly. The node's mainnet Tor onion target port is 8339, the same as its P2P
      # port (chainparamsbase.cpp; upstream uses P2P port + 1), and with no -bind it binds that
      # onion listener on 127.0.0.1:8339 FIRST, so its own 0.0.0.0:8339 fails ("Unable to bind
      # to 0.0.0.0:8339 ... probably already running") and no IPv4 peer could ever connect in,
      # however the router was forwarded. The onion listener moves to 8340.
      - -bind=0.0.0.0:8339
      - "-bind=[::]:8339"
      - -bind=127.0.0.1:8340=onion
      # Not pruned: the whole chain is ~90 MB, and a pruned node announces itself as
      # NODE_NETWORK_LIMITED, which the DNS seeders never list -- so it waited on chance
      # for inbound peers however the router was set up. Earlier releases passed
      # -prune=2000, but Core prunes nothing below height 200,000, so no datadir was ever
      # actually pruned and each one starts unpruned as it is.
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge
      - -rpcpassword=${APP_NODE_RPC_PASSWORD}
      - -zmqpubhashblock=tcp://0.0.0.0:28332  # the stratum subscribes to block hashes only
    healthcheck:
      test: ["CMD-SHELL", "bitcoincashII-cli -datadir=/data/.bch2 -rpcuser=forge -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  node1175:
    image: ghcr.io/bitcoincashii/forge-solo-node1175:1.0.13@sha256:57fb945bd91e90d8f10c22f54b1cee992ead40b4d3439a6e108641f3b712b52e
    networks:
      - forge
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # 1175 (ESF) peer-to-peer, same reasoning as the BCH2 node above.
      - "25360:25360"
    volumes:
      - ${APP_DATA_DIR}/node1175:/data/.elevenseventyfive
    environment:
      - RPC_USER=forge1175
      - RPC_PASSWORD=${APP_1175_RPC_PASSWORD}
    command:
      - -datadir=/data/.elevenseventyfive
      - -disablewallet           # no wallet is used; none can be created over RPC either
      - -printtoconsole
      # Memory: a 100 MB database cache, a 50 MB mempool and a 4 MB signature cache. Core's defaults
      # (450, 300, 32 MB) are sized for a machine of its own; this node shares one, often a small
      # board, with the BCH2 node and other apps, and its whole UTXO set is about 7 MB.
      - -dbcache=100
      - -maxmempool=50
      - -maxsigcachesize=4
      - -listen=1                 # accept inbound peers (forward 25360 in your router)
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge1175
      - -rpcpassword=${APP_1175_RPC_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "elevenseventyfive-cli -datadir=/data/.elevenseventyfive -rpcuser=forge1175 -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  # The database server of 1.0.12 and earlier, kept by name only. Its container has the same name
  # as the one 1.0.12 ran, so an update made while that one still runs replaces it: compose stops
  # it first, giving PostgreSQL its clean shutdown, and only then starts this and, after it, the
  # move below. Without a service of this name the old server would go on running on the old
  # data beside the move's own. This one does nothing and exits.
  postgres:
    image: ghcr.io/bitcoincashii/forge-solo-migrate:1.0.13@sha256:b3567c836560ae583058fb95c4381abf656a20a329e65c603e04b19069468d62
    command: ["noop"]
    restart: "no"
    network_mode: none
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 1m
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Moves the PostgreSQL data of 1.0.12 and earlier (postgres/) into db/forgesolo.db, once, and
  # merges what both recorded after a return to 1.0.12 and back. It runs at every start, before
  # the api and the stratum, and exits: at once when there is nothing to do. It writes what it did
  # to db/migration-status.json. A move that fails replaces nothing and still exits 0, so the
  # dashboard can say why; only an interruption holds the api and the stratum back.
  # As root, with only what it needs: to start PostgreSQL as the old data's owner (SETUID, SETGID)
  # and stop it (KILL), to read that data (DAC_OVERRIDE), and to give the database's files to
  # 10001:10001, the api's and the stratum's user (CHOWN, FOWNER).
  migrate:
    image: ghcr.io/bitcoincashii/forge-solo-migrate:1.0.13@sha256:b3567c836560ae583058fb95c4381abf656a20a329e65c603e04b19069468d62
    command: ["run", "--db=/data/forgesolo.db", "--pgdata=/pg", "--owner=10001:10001"]
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # Room for PostgreSQL to shut down cleanly when the move is stopped part way.
    stop_grace_period: 2m
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${APP_DATA_DIR}/postgres:/pg
      - ${APP_DATA_DIR}/db:/data
    depends_on:
      postgres:
        condition: service_completed_successfully

  api:
    image: ghcr.io/bitcoincashii/forge-solo-api:1.0.13@sha256:98bb9645d42fe716214c508f047a9e34a7be23a7c5ce4be3db6722858d6d76c8
    networks:
      - forge
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # The api and the stratum share one database file, in a folder that belongs to this user.
    user: "10001:10001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      node:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/db:/data
    environment:
      - DB_PATH=/data/forgesolo.db
      - RPC_URL=http://bch2-apps-forge-solo_node_1:8342
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - STRATUM_INTERNAL_URL=http://bch2-apps-forge-solo_stratum_1:3337
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      # Read-only: the dashboard reports whether the 1175 P2P forward is working, which needs
      # that node's own peer list. Same private network, never published to the host.
      - AUX1175_URL=http://bch2-apps-forge-solo_node1175_1:25359
      - AUX1175_USER=forge1175
      - AUX1175_PASSWORD=${APP_1175_RPC_PASSWORD}
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - POOL_NAME=${POOL_NAME:-Forge Solo}
      # The api reads these as fallbacks for a fresh install. Empty means Forge Solo's default
      # tag, //forgesolo//, which the api and stratum both build in.
      - COINBASE_TAG=${COINBASE_TAG:-}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
      # A settings change must carry this app's own password: every app on an Umbrel shares one
      # network and can reach this API directly, without going through umbrelOS's login. umbrelOS
      # derives the password for this app alone and shows it to the owner under the app's Default
      # credentials (deterministicPassword in umbrel-app.yml). Without it the API takes no change.
      - SETTINGS_PASSWORD=${APP_PASSWORD}
    healthcheck:
      # /health checks the database file only.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  stratum:
    image: ghcr.io/bitcoincashii/forge-solo-stratum:1.0.13@sha256:1335d78f24c6373aa5739f4aefb749b3bf72f277a6bd9309ccd0ea58add26002
    networks:
      - forge
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # Room to stop both ports (2 s grace each for connected miners) and send the pool the TIDES
    # shares still queued, instead of Docker's 10 s default killing it part way.
    stop_grace_period: 30s
    user: "10001:10001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      node1175:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/db:/data
    ports:
      - "3333:3333"   # your own hardware, and Braiins (which connects each miner individually)
      - "3335:3335"   # proxied rental hashpower: NiceHash / MiningRigRentals
    environment:
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      # The stats server the api polls. Bound on 0.0.0.0 so the api container can reach it
      # over the private app network; the port is never published to the host, and the
      # constant-time internal-token check is what guards it. Must stay in step with the
      # api's STRATUM_INTERNAL_URL (bch2-apps-forge-solo_stratum_1:3337).
      - INTERNAL_STATS_HOST=0.0.0.0
      - DB_PATH=/data/forgesolo.db
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - NODE_HOST=bch2-apps-forge-solo_node_1
      - NODE_PORT=8342
      - ZMQ_ENDPOINT=tcp://bch2-apps-forge-solo_node_1:28332
      - AUX1175_HOST=bch2-apps-forge-solo_node1175_1
      - AUX1175_PORT=25359
      - AUX1175_USER=forge1175
      - AUX1175_PASSWORD=${APP_1175_RPC_PASSWORD}
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - COINBASE_TAG=${COINBASE_TAG:-}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3333 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/bitcoincashii/forge-solo-web:1.0.13@sha256:20a8e8e47f8cea2a4946bea613c57ef1b2a7f104421f797247a5262d8ca4f7a1
    networks:
      - default
      - forge
    # At most 30 MB of log: umbrelOS 2.0 keeps up to 100 MB for each container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_UPSTREAM=bch2-apps-forge-solo_api_1:8080
