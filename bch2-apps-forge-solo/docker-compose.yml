version: "3.7"

# Forge Solo — self-hosted SOLO mining for home miners.
# Mine BCH2 solo to your OWN address and merge-mine 1175 (ESF) at no extra hashrate cost.
# One household, solo only. All secrets are generated per-install by exports.sh; node RPC
# ports are never published to the host — services talk over the private app network by
# service name, and app_proxy fronts the web dashboard (standard Umbrel pattern).

services:
  # The services reach each other by container name (bch2-apps-forge-solo_<service>_1, the name
  # umbreld gives every container), never by bare service name. Every Umbrel app joins the one
  # shared umbrel_main_network, where a bare name such as "postgres", "api" or "node" is also the
  # alias of other apps' services (BTCPay Server and Immich have a postgres, mempool and LocalAI an
  # api): a lookup then returns both apps' containers, and in review 22 of 40 fresh database
  # connections went to the other app's postgres ("role forge does not exist").
  app_proxy:
    environment:
      APP_HOST: bch2-apps-forge-solo_web_1
      APP_PORT: 80

  node:
    image: ghcr.io/bitcoincashii/forge-solo-node:1.0.12@sha256:6598ac97c2525cd217315e5e1a6cc219386bdf4d2c4d218bb046f4341c9263bb
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # BCH2 peer-to-peer. Published so the node can ACCEPT inbound peers, not just make
      # outbound ones. Forward 8339 in your router to actually receive them. The RPC port
      # is deliberately NOT published -- it stays on the app's private network.
      - "8339:8339"
    volumes:
      - ${APP_DATA_DIR}/node:/data/.bch2
    environment:
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
    command:
      - -datadir=/data/.bch2
      - -printtoconsole
      - -listen=1                 # accept inbound peers (forward 8339 in your router)
      # Bind explicitly. The node's mainnet Tor onion target port is 8339, the same as its P2P
      # port (chainparamsbase.cpp; upstream uses P2P port + 1), and with no -bind it binds that
      # onion listener on 127.0.0.1:8339 FIRST, so its own 0.0.0.0:8339 fails ("Unable to bind
      # to 0.0.0.0:8339 ... probably already running") and no IPv4 peer could ever connect in,
      # however the router was forwarded. The onion listener moves to 8340.
      - -bind=0.0.0.0:8339
      - "-bind=[::]:8339"
      - -bind=127.0.0.1:8340=onion
      # Not pruned: the whole chain is ~90 MB, and a pruned node announces itself as
      # NODE_NETWORK_LIMITED, which the DNS seeders never list -- so it waited on chance
      # for inbound peers however the router was set up. Earlier releases passed
      # -prune=2000, but Core prunes nothing below height 200,000, so no datadir was ever
      # actually pruned and each one starts unpruned as it is.
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge
      - -rpcpassword=${APP_NODE_RPC_PASSWORD}
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -zmqpubrawblock=tcp://0.0.0.0:28332
    healthcheck:
      test: ["CMD-SHELL", "bitcoincashII-cli -datadir=/data/.bch2 -rpcuser=forge -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  node1175:
    image: ghcr.io/bitcoincashii/forge-solo-node1175:1.0.12@sha256:6db2288a4efe415f4f55deab80f15073f1af6cbc6f84bbbed76d8e9d27c64d73
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # 1175 (ESF) peer-to-peer, same reasoning as the BCH2 node above.
      - "25360:25360"
    volumes:
      - ${APP_DATA_DIR}/node1175:/data/.elevenseventyfive
    environment:
      - RPC_USER=forge1175
      - RPC_PASSWORD=${APP_1175_RPC_PASSWORD}
    command:
      - -datadir=/data/.elevenseventyfive
      - -printtoconsole
      - -listen=1                 # accept inbound peers (forward 25360 in your router)
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=forge1175
      - -rpcpassword=${APP_1175_RPC_PASSWORD}
      - -wallet=pool
    healthcheck:
      test: ["CMD-SHELL", "elevenseventyfive-cli -datadir=/data/.elevenseventyfive -rpcuser=forge1175 -rpcpassword=$$RPC_PASSWORD getblockchaininfo || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: forgesolo
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
      # By its absolute path. Umbrel runs compose with its own fragment file first, and compose
      # resolves a relative path from the first file's directory: ./init-db.sql named a file in
      # umbreld's own directory, which does not exist, so Docker created an empty directory there
      # and postgres failed to read it ("could not read from input file: Is a directory") on
      # every fresh install. The app's files, this one included, are in APP_DATA_DIR.
      - ${APP_DATA_DIR}/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forgesolo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/bitcoincashii/forge-solo-api:1.0.12@sha256:82428bc4299a949c776c8cb7386cc5175f2aec0cdcca50bb927125224c5037f5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    environment:
      - DB_HOST=bch2-apps-forge-solo_postgres_1
      - DB_PORT=5432
      - DB_USER=forge
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - DB_NAME=forgesolo
      - DB_SSLMODE=disable
      - RPC_URL=http://bch2-apps-forge-solo_node_1:8342
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - STRATUM_INTERNAL_URL=http://bch2-apps-forge-solo_stratum_1:3337
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      # Read-only: the dashboard reports whether the 1175 P2P forward is working, which needs
      # that node's own peer list. Same private network, never published to the host.
      - AUX1175_URL=http://bch2-apps-forge-solo_node1175_1:25359
      - AUX1175_USER=forge1175
      - AUX1175_PASSWORD=${APP_1175_RPC_PASSWORD}
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - POOL_NAME=${POOL_NAME:-Forge Solo}
      # The api reads these as fallbacks for a fresh install; without them here its
      # fallback branches could never fire, so a user who configured the tag or the 1175
      # address in the Umbrel app config saw "not configured — merge-mining OFF" while
      # merge mining was in fact running, and a tag box showing the default while blocks
      # carried the real one -- which the next Save would then overwrite. Empty means
      # Forge Solo's default tag, //forgesolo//, which the api and stratum both build in.
      - COINBASE_TAG=${COINBASE_TAG:-}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
      - HOME_APP=1
      - CORS_ORIGINS=
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  stratum:
    image: ghcr.io/bitcoincashii/forge-solo-stratum:1.0.12@sha256:3b75a92739f41b0240a5c04457a23fe965bcd83e08ea5047fe41b944ffeb873c
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # Room to stop both ports (2 s grace each for connected miners) and send the pool the TIDES
    # shares still queued, instead of Docker's 10 s default killing it part way.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      node1175:
        condition: service_started
    ports:
      - "3333:3333"   # your own hardware, and Braiins (which connects each miner individually)
      - "3335:3335"   # proxied rental hashpower: NiceHash / MiningRigRentals
    environment:
      - INTERNAL_API_TOKEN=${APP_INTERNAL_API_TOKEN}
      # The stats server the api polls. Bound on 0.0.0.0 so the api container can reach it
      # over the private app network; the port is never published to the host, and the
      # constant-time internal-token check is what guards it. Must stay in step with the
      # api's STRATUM_INTERNAL_URL (http://stratum:3337).
      - INTERNAL_STATS_HOST=0.0.0.0
      # Where the stratum would REACH the api, which is a different thing from the line
      # above: api.exe listens on 8080 (API_LISTEN_PORT), not on 3337. This pointed at
      # 0.0.0.0:3337 -- the stratum's own stats port, which serves only /internal/* -- so
      # every /api/v1/miners/.../settings request would have 404ed. It is inert today
      # because both call sites are gated on !SoloOnly and this app is payout_scheme
      # "solo", but a wrong value that only a future change would expose is worth not
      # leaving in place.
      - API_HOST=bch2-apps-forge-solo_api_1
      - API_PORT=8080
      - DB_HOST=bch2-apps-forge-solo_postgres_1
      - DB_PORT=5432
      - DB_USER=forge
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - DB_NAME=forgesolo
      - DB_SSLMODE=disable
      - RPC_USER=forge
      - RPC_PASSWORD=${APP_NODE_RPC_PASSWORD}
      - NODE_HOST=bch2-apps-forge-solo_node_1
      - NODE_PORT=8342
      - ZMQ_ENDPOINT=tcp://bch2-apps-forge-solo_node_1:28332
      - AUX1175_HOST=bch2-apps-forge-solo_node1175_1
      - AUX1175_PORT=25359
      - AUX1175_USER=forge1175
      - AUX1175_PASSWORD=${APP_1175_RPC_PASSWORD}
      - POOL_ADDRESS=${POOL_ADDRESS:-}
      - COINBASE_TAG=${COINBASE_TAG:-}
      - PAYOUT_ADDRESS_1175=${PAYOUT_ADDRESS_1175:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3333 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/bitcoincashii/forge-solo-web:1.0.12@sha256:e9787ad60148371f380cc7616d5586a090b5f9cca43326dcf76ddcf7e1db8333
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_UPSTREAM=bch2-apps-forge-solo_api_1:8080
